<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Money AI - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #667eea;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 48px;
            color: #1a1a1a;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .message {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 12px;
            margin: 30px 0;
            border-left: 4px solid #667eea;
        }

        .footer {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #999;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            margin: 0 3px;
            animation: pulse 1.5s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Make Money AI</div>
        <h1>Coming Soon</h1>
        <p class="subtitle">Something amazing is on the way</p>

        <div class="message">
            <span>Site will be live soon</span>
            <div style="margin-top: 12px;">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Make Money AI. Part of the GoBizIT ecosystem.</p>
            <p style="margin-top: 8px;">makemoney.gobizit.ai</p>
        </div>
    </div>
</body>
</html>
