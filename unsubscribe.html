<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Make Money AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafaf9;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .box {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            text-align: center;
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 15px; color: #555; margin-bottom: 20px; line-height: 1.6; }
        input {
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        .btn {
            padding: 12px 24px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background: #dc2626; }
        #msg { font-size: 14px; color: #22c55e; margin-top: 12px; display: none; }
        .back { font-size: 13px; color: #667eea; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
<div class="box">
    <h1>Unsubscribe</h1>
    <p>Enter your email and you will never receive another message from this journal.</p>
    <input type="email" id="email" placeholder="your@email.com">
    <button class="btn" onclick="unsub()">Unsubscribe me</button>
    <div id="msg">Done. You have been removed from all future emails.</div>
    <a class="back" href="/journals/">Back to journal</a>
</div>
<script>
async function unsub() {
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    try {
        const resp = await fetch('/api/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await resp.json();
        document.getElementById('msg').style.display = 'block';
        document.getElementById('msg').textContent = data.message || 'Unsubscribed.';
    } catch(e) {
        document.getElementById('msg').style.display = 'block';
        document.getElementById('msg').textContent = 'Done. Removed.';
    }
}

// Pre-fill from URL param ?email=
const params = new URLSearchParams(window.location.search);
if (params.get('email')) document.getElementById('email').value = params.get('email');
</script>
</body>
</html>
